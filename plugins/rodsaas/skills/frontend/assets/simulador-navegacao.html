<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rodsaas · simulador de navegação</title>
<style>
:root{
  --brand:#7C3AED;
  --bg:#ffffff; --panel:#fafafa; --rail:#f1f1f3; --text:#18181b; --muted:#71717a; --faint:#a1a1aa;
  --border:#e4e4e7; --hover:#ececef; --card:#ffffff; --shadow:0 10px 30px -8px rgb(0 0 0 / .18), 0 2px 6px rgb(0 0 0 / .06);
  --danger:#dc2626; --warn:#d97706; --ok:#16a34a; --info:#2563eb;
  --brand-weak:color-mix(in oklab, var(--brand) 12%, transparent);
  --brand-text:color-mix(in oklab, var(--brand) 85%, var(--text));
  --stage:#e9e9ee;
}
[data-theme="dark"]{
  --bg:#17171a; --panel:#111114; --rail:#0b0b0d; --text:#f4f4f5; --muted:#a1a1aa; --faint:#71717a;
  --border:#27272a; --hover:#232327; --card:#1d1d21; --shadow:0 10px 30px -8px rgb(0 0 0 / .6), 0 2px 6px rgb(0 0 0 / .4);
  --brand-weak:color-mix(in oklab, var(--brand) 22%, transparent);
  --brand-text:color-mix(in oklab, var(--brand) 70%, white);
  --stage:#0c0c0e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--stage);color:var(--text);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}
svg.i.lg{width:22px;height:22px}

/* ---------- palco / dispositivos */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:0}
#frame{container-type:inline-size;container-name:frame;width:100%;height:100%;background:var(--bg);position:relative;overflow:hidden}
#stage[data-device="laptop"]{padding:24px}
#stage[data-device="laptop"] #frame{width:1280px;height:800px;max-height:calc(100vh - 48px);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--border);flex:none}
#stage[data-device="phone"]{padding:24px}
#stage[data-device="phone"] #frame{width:390px;height:800px;max-height:calc(100vh - 48px);border-radius:36px;box-shadow:0 0 0 10px #18181b, var(--shadow);flex:none}

/* ---------- casca */
.app{display:flex;height:100%;width:100%}
.rail{width:60px;flex:none;background:var(--rail);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;z-index:30}
.rail .mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;overflow-y:auto;overflow-x:hidden;width:100%;padding:2px 0;scrollbar-width:none}
.rail .mid::-webkit-scrollbar{display:none}
.rail .sep{width:28px;height:1px;background:var(--border);margin:6px 0;flex:none}
.rbtn{position:relative;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .12s,color .12s}
.rbtn:hover{background:var(--hover);color:var(--text)}
.rbtn.active{background:var(--brand-weak);color:var(--brand-text)}
.rbtn.active::before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.rbtn.temp{outline:1.5px dashed var(--border);outline-offset:-1.5px}
.rbtn .badge{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--rail)}
.rbtn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid var(--rail)}
.org{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;margin-bottom:4px;flex:none}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}
.avatar.s{width:22px;height:22px;font-size:10px}
.tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:#18181b;color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:7px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s;z-index:60}
[data-theme="dark"] .tip{background:#f4f4f5;color:#18181b}
.rbtn:hover .tip{opacity:1}
.rail.collapsed .rbtn[data-app]:not([data-app="inicio"]):hover .tip{opacity:0}

.sidebar{width:256px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;z-index:20}
.sb-head{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 16px}
.sb-head h2{font-size:15px;margin:0;flex:1;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.sb-body{flex:1;overflow-y:auto;padding:2px 8px 12px}
.sb-sec{margin-top:10px}
.sb-sec-t{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:6px 8px}
.sb-sec-t button{color:var(--faint);border-radius:5px;display:grid;place-items:center;width:20px;height:20px}
.sb-sec-t button:hover{background:var(--hover);color:var(--text)}
.item{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:8px;color:var(--text);text-align:left;font-size:13.5px;min-height:32px}
.item:hover{background:var(--hover)}
.item.active{background:var(--brand-weak);color:var(--brand-text);font-weight:600}
.item .ico{color:var(--muted);display:grid;place-items:center}
.item.active .ico{color:var(--brand-text)}
.item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .cnt{font-size:11.5px;color:var(--muted);font-weight:600}
.item .cnt.red{color:#fff;background:var(--danger);border-radius:9px;padding:0 6px;line-height:17px}
.item .cdot{width:9px;height:9px;border-radius:3px;flex:none;margin:0 3px}
.item .online{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.tree-tg{width:18px;height:18px;display:grid;place-items:center;border-radius:4px;color:var(--faint);margin-left:-4px}
.tree-tg:hover{background:var(--border)}
.sb-foot{border-top:1px solid var(--border);padding:10px 12px;font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--border);margin-top:6px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--brand);border-radius:3px}
.sb-classic-top{padding:12px 12px 4px;display:flex;align-items:center;gap:10px}
.orgbtn{display:flex;align-items:center;gap:10px;flex:1;padding:6px;border-radius:9px;text-align:left}
.orgbtn:hover{background:var(--hover)}
.orgbtn .org{margin:0;width:30px;height:30px;border-radius:8px;font-size:12px}
.orgbtn b{display:block;font-size:13.5px}
.orgbtn small{color:var(--muted);font-size:11.5px}
.sb-classic-bottom{border-top:1px solid var(--border);padding:8px;display:flex;gap:4px;align-items:center}

/* flyout (menu recolhido + mouse por cima) */
.flyout{position:absolute;top:8px;bottom:8px;left:66px;width:256px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:40}
.anim{animation:fin .12s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.palette.anim{animation:fade .12s ease-out}
@keyframes fin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}

/* conteúdo */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--border)}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--text);font-weight:600}
.topbar .grow{flex:1}
.searchbox{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;min-width:220px;background:var(--bg)}
.searchbox kbd{margin-left:auto}
kbd{font:600 11px ui-monospace,monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted);background:var(--panel)}
.content{flex:1;overflow:auto;padding:22px 26px 40px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-size:22px;margin:0;letter-spacing:-.01em}
.ph .sub{color:var(--muted);font-size:13px}
.ph .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;font-weight:600;font-size:13.5px;border:1px solid var(--border);background:var(--bg)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);background:var(--bg)}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--brand-weak);color:var(--brand-text);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--hover);color:var(--muted)}
.pill.ok{background:color-mix(in oklab,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in oklab,var(--warn) 15%,transparent);color:var(--warn)}
.pill.danger{background:color-mix(in oklab,var(--danger) 14%,transparent);color:var(--danger)}
.pill.info{background:color-mix(in oklab,var(--info) 14%,transparent);color:var(--info)}
.who{display:flex;align-items:center;gap:8px}

/* kanban */
.board{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
.col{width:268px;flex:none;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px}
.col-h{display:flex;align-items:baseline;gap:6px;padding:2px 4px 10px}
.col-h b{font-size:13px}
.col-h span{font-size:12px;color:var(--muted)}
.col-h .tot{margin-left:auto;font-weight:700;color:var(--text);font-size:12.5px}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:8px;box-shadow:0 1px 2px rgb(0 0 0 / .04)}
.kcard:hover{border-color:color-mix(in oklab,var(--brand) 45%,var(--border))}
.kcard .t{font-weight:600;font-size:13.5px}
.kcard .s{color:var(--muted);font-size:12.5px;margin-top:2px}
.kcard .f{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px}
.kcard .f .v{font-weight:700;white-space:nowrap}
.na{white-space:nowrap}
.kcard .f .grow{flex:1}
.na{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px}
.na.today{background:color-mix(in oklab,var(--warn) 16%,transparent);color:var(--warn)}
.na.overdue{background:color-mix(in oklab,var(--danger) 14%,transparent);color:var(--danger)}
.na.future{background:var(--hover);color:var(--muted)}
.na.none{border:1px dashed var(--warn);color:var(--warn)}
.code{font:600 11.5px ui-monospace,monospace;color:var(--muted)}

/* tarefas lista */
.grp{margin-bottom:18px}
.grp h3{font-size:13px;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.grp h3 span{color:var(--muted);font-weight:600}
.trow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border)}
.trow:last-child{border-bottom:0}
.chk{width:17px;height:17px;border-radius:50%;border:2px solid var(--faint);flex:none}
.trow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due{font-size:12px;font-weight:600;color:var(--muted)}
.due.red{color:var(--danger)}

/* doc */
.doc{max-width:720px;margin:10px auto}
.doc .emoji{font-size:44px}
.doc h1{font-size:34px;margin:8px 0 14px;letter-spacing:-.02em}
.doc p{font-size:15.5px;line-height:1.65;margin:0 0 12px}
.doc .callout{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--border);margin:14px 0}
.doc .todo{display:flex;gap:10px;align-items:center;font-size:15px;margin:6px 0}
.doc .todo i{width:16px;height:16px;border:2px solid var(--faint);border-radius:4px;display:inline-block}
.doc .todo.done i{background:var(--brand);border-color:var(--brand)}
.doc .todo.done span{color:var(--muted);text-decoration:line-through}

/* início */
.widgets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.widget{padding:14px 16px}
.widget h4{margin:0 0 10px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.widget h4 .appico{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff}
.widget h4 a{margin-left:auto;font-size:12px;color:var(--brand-text);font-weight:600;cursor:pointer}
.wrow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-top:1px solid var(--border)}
.wrow:first-of-type{border-top:0}
.wrow .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px}
.bar span{width:96px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar i{height:10px;border-radius:5px;background:var(--brand);display:block}
.bar b{font-size:12px}

/* chat */
.chatwrap{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow:auto}
.msg{display:flex;gap:10px;padding:8px 0}
.msg b{font-size:13.5px}
.msg small{color:var(--muted);margin-left:6px}
.msg p{margin:2px 0 0;font-size:14px}
.composer{border:1px solid var(--border);border-radius:12px;padding:10px 12px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:10px}

/* launcher, paleta, popovers */
.overlay{position:absolute;inset:0;z-index:50}
.overlay.dim{background:rgb(0 0 0 / .35)}
.launcher{position:absolute;left:68px;top:10px;bottom:10px;width:min(720px,calc(100% - 90px));background:var(--bg);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.launcher .lh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.launcher .lh input{flex:1;border:0;outline:0;background:transparent;font-size:15px}
.launcher .lb{flex:1;overflow:auto;padding:6px 16px 16px}
.launcher .cat{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tile{position:relative;display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;border:1px solid var(--border);text-align:left;background:var(--card)}
.tile:hover{border-color:color-mix(in oklab,var(--brand) 45%,var(--border));background:var(--hover)}
.tile.off{opacity:.55}
.appico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.tile b{display:block;font-size:13.5px}
.tile small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:1px;padding-right:18px}
.tile .star{position:absolute;top:8px;right:8px;color:var(--faint);width:22px;height:22px;display:grid;place-items:center;border-radius:6px}
.tile .star:hover{background:var(--border);color:var(--text)}
.tile .star.on{color:#f59e0b}
.tile .star.on svg{fill:#f59e0b}
.launcher .lf{border-top:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.launcher .lf a{color:var(--brand-text);font-weight:600;cursor:pointer;margin-left:auto}
.palette{position:absolute;left:50%;top:12%;transform:translateX(-50%);width:min(600px,calc(100% - 24px));background:var(--bg);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.palette .ph2{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.palette input{flex:1;border:0;outline:0;background:transparent;font-size:15px}
.palette .res{max-height:380px;overflow:auto;padding:6px}
.palette .grpt{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px 4px}
.palette .r{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.palette .r.sel{background:var(--brand-weak)}
.palette .r small{color:var(--muted);margin-left:auto;font-size:12px}
.pop{position:absolute;background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:240px}
.pop .pi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;font-size:13.5px}
.pop .pi:hover{background:var(--hover)}
.pop .pt{font-size:12px;color:var(--muted);padding:6px 10px}
.pop hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.notif{display:flex;gap:10px;padding:9px 10px;border-radius:8px;font-size:13px;align-items:flex-start}
.notif:hover{background:var(--hover)}
.notif .appico{width:26px;height:26px;border-radius:7px}
.notif small{display:block;color:var(--muted);font-size:11.5px}

/* configurações */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{padding:8px 12px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--text);border-color:var(--brand)}
.arow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border)}
.arow:last-child{border-bottom:0}
.arow .grow{flex:1}
.arow small{display:block;color:var(--muted);font-size:12px}
.switch{width:38px;height:22px;border-radius:11px;background:var(--border);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgb(0 0 0 / .3)}
.switch.on{background:var(--brand)}
.switch.on::after{left:19px}
.switch.lock{opacity:.5;cursor:not-allowed}

/* celular */
.mtop,.mtab{display:none}
.drawer{position:absolute;top:0;bottom:0;left:0;width:84%;max-width:320px;background:var(--panel);z-index:55;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:din .16s ease-out}
@keyframes din{from{transform:translateX(-100%)}to{transform:none}}
@container frame (max-width: 760px){
  .rail,.sidebar,.flyout,.topbar{display:none !important}
  .main{padding-bottom:0}
  .mtop{display:flex;align-items:center;gap:6px;height:54px;padding:0 8px;border-bottom:1px solid var(--border);flex:none;background:var(--bg)}
  .mtop .ttl{flex:1;font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;min-width:0}
  .mtop .ttl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mtab{display:flex;height:64px;flex:none;border-top:1px solid var(--border);background:var(--bg);padding-bottom:6px}
  .mtab button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:600;position:relative}
  .mtab button.on{color:var(--brand-text)}
  .mtab .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;display:grid;place-items:center}
  .content{padding:16px 14px 30px}
  .ph h1{font-size:19px}
  .ph .btn.primary{position:absolute;right:16px;bottom:80px;z-index:10;height:48px;border-radius:24px;padding:0 18px;box-shadow:var(--shadow)}
  .launcher{left:0;right:0;top:0;bottom:0;width:auto;border-radius:0;border:0}
  .tiles{grid-template-columns:1fr 1fr}
  .tile small{display:none}
  .col{width:82%}
  .board{scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .hide-m{display:none !important}
  .widgets{grid-template-columns:1fr}
  table .hide-m{display:none}
  .searchbox{display:none}
}

/* ---------- painel do simulador (fora do app) */
#sim{position:fixed;right:16px;bottom:16px;width:300px;background:#18181b;color:#f4f4f5;border-radius:14px;box-shadow:0 20px 40px -10px rgb(0 0 0 / .5);font-size:13px;z-index:1000;overflow:hidden;border:1px solid #2a2a2e}
#sim header{display:flex;align-items:center;gap:8px;padding:11px 14px;background:#202024;cursor:pointer;user-select:none}
#sim header b{flex:1}
#sim .b{padding:12px 14px;display:flex;flex-direction:column;gap:11px;max-height:70vh;overflow:auto}
#sim.min .b{display:none}
#sim label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#a1a1aa;display:block;margin-bottom:5px}
#sim select{width:100%;background:#2a2a2e;color:#f4f4f5;border:1px solid #3f3f46;border-radius:8px;padding:7px 8px;font:inherit}
.seg{display:flex;background:#2a2a2e;border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;padding:6px 4px;border-radius:6px;color:#a1a1aa;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:#3f3f46;color:#fff}
.sw{display:flex;gap:8px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent}
.sw button.on{border-color:#fff}
#sim .hint{background:#27272a;border-radius:9px;padding:9px 11px;color:#d4d4d8;line-height:1.5;font-size:12.5px}
#sim .hint b{color:#fff}
#sim .row{display:flex;gap:8px}
#sim .row button{flex:1;background:#2a2a2e;border:1px solid #3f3f46;border-radius:8px;padding:7px;font-weight:600;font-size:12px}
#sim .row button:hover{background:#3f3f46}
</style>

// ------------------------------------------------------------------ estado
const store = {
  get(k, d) { try { const v = localStorage.getItem("rodsaas-sim:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("rodsaas-sim:" + k, JSON.stringify(v)); } catch {} },
};
const S = {
  scenario: store.get("scenario", "todos"),
  device: store.get("device", "desktop"),
  collapsed: store.get("collapsed", false),
  theme: store.get("theme", "light"),
  brand: store.get("brand", "#7C3AED"),
  pins: store.get("pins", null),
  disabled: store.get("disabled", []),
  last: {},
  open: { "p-proc": true },
  overlay: null, // launcher | palette | notif | org | user | drawer
  flyout: null,
  launcherQ: "",
  paletteQ: "",
  paletteSel: 0,
  settingsTab: "apps",
};
const installed = () => SCENARIOS[S.scenario].filter((id) => !S.disabled.includes(id));
const userApps = () => installed().filter((id) => id !== "inicio");
const pins = () => (S.pins ?? DEFAULT_PINS[S.scenario]).filter((id) => userApps().includes(id));
const singleApp = () => userApps().length <= 1;
const isPhone = () => document.getElementById("frame").clientWidth <= 760;

function route() {
  const [, app = "inicio", page = "", ...rest] = (location.hash || "#/inicio/visao").split("/");
  return { app, page: page || defaultPage(app), rest };
}
function defaultPage(appId) {
  const a = APP[appId]; if (!a) return "";
  for (const sec of a.menu) { if (sec.items?.length) return sec.items[0].id; if (sec.tree?.length) return sec.tree[0].id; }
  return "";
}
function go(appId, page) {
  const p = page ?? S.last[appId] ?? defaultPage(appId);
  S.overlay = null; S.flyout = null;
  location.hash = `#/${appId}/${p}`;
}
function findItem(appId, pageId) {
  const a = APP[appId]; if (!a) return null;
  for (const sec of a.menu) {
    for (const it of sec.items ?? []) if (it.id === pageId) return it;
    const walk = (nodes) => { for (const n of nodes) { if (n.id === pageId) return n; const r = n.children && walk(n.children); if (r) return r; } return null; };
    const t = sec.tree && walk(sec.tree); if (t) return t;
  }
  if (appId === "config") return { label: "Configurações" };
  return null;
}

// ------------------------------------------------------------------ peças da casca
const appIco = (a, size = "") => `<span class="appico ${size}" style="background:${CATS[a.cat].color}">${icon(a.icon, "sm")}</span>`;

function railHTML(r) {
  const p = pins();
  const cur = r.app;
  const temp = APP[cur] && cur !== "inicio" && !p.includes(cur) && userApps().includes(cur) ? cur : null;
  const btn = (a) => `<button class="rbtn ${cur === a.id ? "active" : ""} ${a.id === temp ? "temp" : ""}" data-app="${a.id}" aria-label="${esc(a.name)}">
      ${icon(a.icon)}${a.badge ? `<span class="badge">${a.badge}</span>` : a.dot ? `<span class="dot"></span>` : ""}<span class="tip">${esc(a.name)}</span></button>`;
  return `<nav class="rail ${S.collapsed ? "collapsed" : ""}">
    <button class="org" data-act="org" title="Acme Comércio">AC</button>
    ${btn(APP.inicio)}
    <div class="sep"></div>
    <div class="mid">
      ${p.map((id) => btn(APP[id])).join("")}
      ${temp ? `<div class="sep"></div>${btn(APP[temp])}` : ""}
      ${`<button class="rbtn ${S.overlay === "launcher" ? "active" : ""}" data-act="launcher" aria-label="Todos os apps">${icon("layout-grid")}<span class="tip">Todos os apps</span></button>`}
    </div>
    <div class="sep"></div>
    <button class="rbtn" data-act="palette" aria-label="Buscar">${icon("search")}<span class="tip">Buscar · Ctrl K</span></button>
    <button class="rbtn ${S.overlay === "notif" ? "active" : ""}" data-act="notif" aria-label="Notificações">${icon("bell")}<span class="badge">7</span><span class="tip">Notificações</span></button>
    <button class="rbtn ${cur === "config" ? "active" : ""}" data-act="settings" aria-label="Configurações">${icon("settings")}<span class="tip">Configurações</span></button>
    ${S.collapsed ? `<button class="rbtn" data-act="expand" aria-label="Abrir menu">${icon("chevrons-right")}<span class="tip">Abrir menu · [</span></button>` : ""}
    <button class="rbtn" data-act="user" aria-label="Conta"><span class="avatar">RO</span><span class="tip">Rodrigo</span></button>
  </nav>`;
}

function menuItemsHTML(a, r, sec) {
  let h = "";
  if (sec.items) for (const it of sec.items) {
    const active = r.app === a.id && r.page === it.id;
    const lead = it.color ? `<span class="cdot" style="background:${it.color}"></span>` : it.emoji ? `<span style="width:18px;text-align:center">${it.emoji}</span>` : it.online !== undefined ? `<span class="avatar s" style="background:${PEOPLE.find((x) => x[1] === it.label)?.[2] ?? "#a1a1aa"}">${it.label.split(" ").map((x) => x[0]).join("")}</span>` : `<span class="ico">${icon(it.icon || "circle-dot", "sm")}</span>`;
    const tail = it.badge ? `<span class="cnt ${it.red ? "red" : ""}">${it.badge}</span>` : it.cnt ? `<span class="cnt">${it.cnt}</span>` : it.online ? `<span class="online"></span>` : "";
    h += `<button class="item ${active ? "active" : ""}" data-go="${a.id}/${it.id}">${lead}<span class="lbl">${esc(it.label)}</span>${tail}</button>`;
  }
  if (sec.tree) {
    const walk = (nodes, depth) => nodes.map((n) => {
      const open = S.open[n.id];
      const active = r.app === a.id && r.page === n.id;
      return `<button class="item ${active ? "active" : ""}" data-go="${a.id}/${n.id}" style="padding-left:${8 + depth * 16}px">
        <span class="tree-tg" data-tg="${n.id}">${n.children ? icon(open ? "chevron-down" : "chevron-right", "sm") : ""}</span>
        <span style="width:18px;text-align:center">${n.emoji}</span><span class="lbl">${esc(n.label)}</span></button>${n.children && open ? walk(n.children, depth + 1) : ""}`;
    }).join("");
    h += walk(sec.tree, 0);
  }
  return h;
}

function contentHTML(r) {
  if (r.app === "config") return settingsPage();
  const a = APP[r.app];
  if (!a || !installed().includes(r.app)) return `<div class="ph"><h1>App não encontrado</h1></div><p style="color:var(--muted)">Este app não está ativo nesta empresa. <a style="color:var(--brand-text);cursor:pointer" data-go="inicio/visao">Voltar ao início</a></p>`;
  const it = findItem(r.app, r.page) ?? { label: a.name };
  if (a.id === "inicio" && r.page === "visao") return homePage();
  if (a.id === "crm" && (r.page === "negocios" || r.page === "f-vendas")) return crmBoard(a);
  if (a.id === "tarefas" && r.page === "minhas") return tasksMine(a);
  if (a.id === "tarefas" && r.page.startsWith("p-")) return tasksBoard(a, it);
  if (a.id === "paginas" && r.page.startsWith("p-")) return docPage(it);
  if (a.id === "chat") return chatPage(it);
  return genericPage(a, it);
}

function paletteResults() {
  const q = S.paletteQ.trim().toLowerCase();
  const res = [];
  for (const id of installed()) {
    const a = APP[id];
    if (!q || a.name.toLowerCase().includes(q)) res.push({ grp: "Apps", label: a.name, sub: CATS[a.cat].name, icon: a.icon, go: `${id}/${S.last[id] ?? defaultPage(id)}` });
    for (const sec of a.menu) {
      const items = [...(sec.items ?? [])];
      const walk = (ns) => ns.forEach((n) => { items.push({ ...n, icon: "file-text" }); n.children && walk(n.children); });
      sec.tree && walk(sec.tree);
      for (const it of items) if (q && it.label.toLowerCase().includes(q)) res.push({ grp: a.name, label: it.label, sub: a.name, icon: it.icon || a.icon, go: `${id}/${it.id}` });
    }
  }
  if (q) for (const n of SAMPLE) if (n.toLowerCase().includes(q)) res.push({ grp: "Registros", label: n, sub: "CRM · Empresa", icon: "building-2", go: "crm/empresas" });
  return res.slice(0, 40);
}

  return `<div class="overlay dim" data-close="1"><div class="palette ${S._anim}" role="dialog" aria-label="Buscar">
    <div class="ph2">${icon("search")}<input id="pq" placeholder="Buscar apps, páginas, negócios, contatos…" value="${esc(S.paletteQ)}" autocomplete="off"><kbd>Esc</kbd></div>
    <div class="res">${res.map((r, i) => { const g = r.grp !== grp ? `<div class="grpt">${esc((grp = r.grp))}</div>` : ""; return `${g}<button class="r ${i === S.paletteSel ? "sel" : ""}" data-go="${r.go}">${icon(r.icon, "sm")}<span>${esc(r.label)}</span><small>${esc(r.sub)}</small></button>`; }).join("") || `<p style="color:var(--muted);padding:10px">Nada encontrado.</p>`}</div>
  </div></div>`;
}

function popHTML(kind) {
  const left = singleApp() ? 12 : 66;
  if (kind === "notif") {
    const n = [["crm", "<b>Ana</b> te atribuiu o negócio <b>Clínica Vida</b>", "há 5 min"], ["helpdesk", "Chamado <b>#1042</b> perto de estourar o SLA", "há 12 min"], ["tarefas", "<b>Bruno</b> mencionou você em <b>MKT-12</b>", "há 1 h"], ["aprovacoes", "Nova solicitação: <b>Compra de 3 notebooks</b>", "há 2 h"], ["paginas", "<b>Carla</b> editou <b>Planejamento 2027</b>", "ontem"], ["chat", "3 mensagens novas em <b>#vendas</b>", "ontem"]]
      .filter(([id]) => installed().includes(id));
    return `<div class="overlay" data-close="1"><div class="pop ${S._anim}" style="left:${left}px;bottom:${isPhone() ? "auto" : "60px"};top:${isPhone() ? "56px" : "auto"};width:340px;${isPhone() ? "right:8px;left:auto" : ""}">
      <div class="pt" style="display:flex"><b style="color:var(--text)">Notificações</b><span style="margin-left:auto">Marcar todas como lidas</span></div>
      ${n.map(([id, t, d]) => `<div class="notif">${appIco(APP[id])}<div>${t}<small>${APP[id].name} · ${d}</small></div></div>`).join("")}</div></div>`;
  }
  if (kind === "org") return `<div class="overlay" data-close="1"><div class="pop ${S._anim}" style="left:${left}px;top:10px">
      <div class="pt">Empresas</div><button class="pi"><span class="org" style="width:26px;height:26px;font-size:11px;margin:0">AC</span>Acme Comércio ${icon("check", "sm")}</button>
      <button class="pi"><span class="org" style="width:26px;height:26px;font-size:11px;margin:0;background:#0ea5e9">RT</span>Rod Tecnologia</button><hr><button class="pi">${icon("plus", "sm")}Criar nova empresa</button></div></div>`;
  if (kind === "user") return `<div class="overlay" data-close="1"><div class="pop ${S._anim}" style="left:${left}px;bottom:10px">
      <div class="pt"><b style="color:var(--text)">Rodrigo</b><br>rodrigo@acme.com.br</div><hr><button class="pi">${icon("user", "sm")}Perfil</button><button class="pi" data-act="theme">${icon(S.theme === "dark" ? "sun" : "moon", "sm")}Tema ${S.theme === "dark" ? "claro" : "escuro"}</button><button class="pi" data-go="config/conta">${icon("settings", "sm")}Configurações</button><hr><button class="pi">${icon("log-out", "sm")}Sair</button></div></div>`;
  return "";
}

function drawerHTML(r) {
  const a = APP[r.app] ?? APP.inicio;
  return `<div class="overlay dim" data-close="1"></div><aside class="drawer">
    <div class="sb-classic-top"><button class="orgbtn" data-act="org"><span class="org">AC</span><span><b>Acme Comércio</b><small>Trocar empresa</small></span></button><button class="iconbtn" data-act="close">${icon("x")}</button></div>
    ${singleApp() ? `<div class="sb-body"><div class="sb-sec">${menuItemsHTML(APP.inicio, r, { items: [I("visao", "Início", "house")] })}</div>${APP[userApps()[0]].menu.map((sec) => `<div class="sb-sec">${sec.title ? `<div class="sb-sec-t"><span>${esc(sec.title)}</span></div>` : ""}${menuItemsHTML(APP[userApps()[0]], r, sec)}</div>`).join("")}</div>`
      : appMenuHTML(a, r, { inFlyout: true }).replace(/<button class="iconbtn" data-act="expand"[\s\S]*?<\/button>/, "")}
    <div class="sb-classic-bottom"><button class="iconbtn" data-act="settings">${icon("settings")}</button><span style="flex:1"></span><button data-act="user"><span class="avatar">RO</span></button></div></aside>`;
}

// ------------------------------------------------------------------ render
function render() {
  const r = route();
  const fresh = (S._lastOverlay !== S.overlay) || (S._lastFly !== S.flyout);
  S._anim = fresh ? "anim" : "";
  S._lastOverlay = S.overlay; S._lastFly = S.flyout;
  if (APP[r.app]) S.last[r.app] = r.page;
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.style.setProperty("--brand", S.brand);
  const frame = document.getElementById("frame");
  const single = singleApp();
  frame.innerHTML = `<div class="app">
    ${single ? "" : railHTML(r)}
    ${sidebarHTML(r)}
    ${S.flyout && APP[S.flyout] && !single ? `<div class="flyout ${S._anim}" data-flyout="${S.flyout}">${appMenuHTML(APP[S.flyout], r, { inFlyout: true })}</div>` : ""}
    <main class="main">${mobileTopHTML(r)}${topbarHTML(r)}<div class="content" style="${r.app === "chat" ? "display:flex;flex-direction:column" : ""}">${contentHTML(r)}</div>${mobileTabHTML(r)}</main>
    ${S.overlay === "launcher" ? launcherHTML() : ""}
    ${S.overlay === "palette" ? paletteHTML() : ""}
    ${["notif", "org", "user"].includes(S.overlay) ? popHTML(S.overlay) : ""}
    ${S.overlay === "drawer" ? drawerHTML(r) : ""}
  </div>`;
  const lq = document.getElementById("lq"); if (lq && !isPhone()) { lq.focus(); lq.setSelectionRange(lq.value.length, lq.value.length); }
  const pq = document.getElementById("pq"); if (pq) { pq.focus(); pq.setSelectionRange(pq.value.length, pq.value.length); }
  syncSim();
}

// ------------------------------------------------------------------ eventos
let flyTimer = null, flyClose = null;
const frame = document.getElementById("frame");
frame.addEventListener("click", (e) => {
  const t = e.target;
  const tg = t.closest("[data-tg]");
  if (tg && tg.innerHTML) { e.stopPropagation(); S.open[tg.dataset.tg] = !S.open[tg.dataset.tg]; render(); return; }
  const pin = t.closest("[data-pin]");
  if (pin) { e.stopPropagation(); const id = pin.dataset.pin; const p = pins(); S.pins = p.includes(id) ? p.filter((x) => x !== id) : [...p, id]; store.set("pins", S.pins); render(); return; }
  const toggle = t.closest("[data-toggle]");
  if (toggle) { const id = toggle.dataset.toggle; S.disabled = S.disabled.includes(id) ? S.disabled.filter((x) => x !== id) : [...S.disabled, id]; store.set("disabled", S.disabled); render(); return; }
  const tab = t.closest("[data-tab]"); if (tab) { S.settingsTab = tab.dataset.tab; render(); return; }
  const g = t.closest("[data-go]");
  if (g) { const [app, page] = g.dataset.go.split("/"); if (app === "config") { S.settingsTab = page || "apps"; S.overlay = null; S.flyout = null; location.hash = "#/config/" + (page || "apps"); render(); return; } go(app, page); if (location.hash === `#/${app}/${page}`) render(); return; }
  const ap = t.closest("[data-app]");
  if (ap) { const id = ap.dataset.app; S.launcherQ = ""; go(id); render(); return; }
  const act = t.closest("[data-act]")?.dataset.act;
  if (act) {
    if (act === "collapse") { S.collapsed = true; store.set("collapsed", true); }
    else if (act === "expand") { S.collapsed = false; S.flyout = null; store.set("collapsed", false); }
    else if (act === "close") S.overlay = null;
    else if (act === "settings") { S.overlay = null; S.flyout = null; location.hash = "#/config/" + S.settingsTab; }
    else if (act === "theme") { S.theme = S.theme === "dark" ? "light" : "dark"; store.set("theme", S.theme); }
    else if (act === "palette") { S.overlay = "palette"; S.paletteQ = ""; S.paletteSel = 0; S.flyout = null; }
    else S.overlay = S.overlay === act ? null : act;
    if (act !== "expand") S.flyout = null;
    render(); return;
  }
  if (t.closest("[data-close]") && t === t.closest("[data-close]")) { S.overlay = null; render(); }
});
// menu recolhido: mouse por cima de um app no trilho abre o menu flutuante
frame.addEventListener("mouseover", (e) => {
  if (!S.collapsed || isPhone() || S.overlay) return;
  const b = e.target.closest(".rail [data-app]");
  const fly = e.target.closest(".flyout");
  if (b || fly) clearTimeout(flyClose);
  if (b && b.dataset.app !== "inicio" && b.dataset.app !== S.flyout) {
    clearTimeout(flyTimer);
    flyTimer = setTimeout(() => { S.flyout = b.dataset.app; render(); }, 200);
  }
});
frame.addEventListener("mouseout", (e) => {
  if (!S.collapsed) return;
  const from = e.target.closest(".rail [data-app], .flyout");
  const to = e.relatedTarget?.closest?.(".rail [data-app], .flyout");
  if (from && !to) { clearTimeout(flyTimer); clearTimeout(flyClose); flyClose = setTimeout(() => { if (S.flyout) { S.flyout = null; render(); } }, 300); }
});
frame.addEventListener("input", (e) => {
  if (e.target.id === "lq") { S.launcherQ = e.target.value; render(); }
  if (e.target.id === "pq") { S.paletteQ = e.target.value; S.paletteSel = 0; render(); }
});
document.addEventListener("keydown", (e) => {
  const typing = /input|textarea|select/i.test(document.activeElement?.tagName ?? "");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); S.overlay = "palette"; S.paletteQ = ""; S.paletteSel = 0; render(); return; }
  if (e.key === "Escape") { if (S.overlay || S.flyout) { S.overlay = null; S.flyout = null; render(); } return; }
  if (S.overlay === "palette" && ["ArrowDown", "ArrowUp", "Enter"].includes(e.key)) {
    e.preventDefault();
    const res = paletteResults();
    if (e.key === "Enter" && res[S.paletteSel]) { const [a, p] = res[S.paletteSel].go.split("/"); go(a, p); render(); return; }
    S.paletteSel = Math.max(0, Math.min(res.length - 1, S.paletteSel + (e.key === "ArrowDown" ? 1 : -1))); render(); return;
  }
  if (!typing && e.key === "[" && !singleApp()) { S.collapsed = !S.collapsed; S.flyout = null; store.set("collapsed", S.collapsed); render(); }
});
window.addEventListener("hashchange", () => { const r = route(); if (r.app === "config") S.settingsTab = r.page || "apps"; render(); });
window.addEventListener("resize", render);

// ------------------------------------------------------------------ painel do simulador
const $ = (id) => document.getElementById(id);
function syncSim() {
  $("scenario").value = S.scenario;
  document.getElementById("stage").dataset.device = S.device;
  for (const [id, val] of [["device", S.device], ["menuMode", S.collapsed ? "collapsed" : "open"], ["theme", S.theme], ["brand", S.brand]])
    $(id).querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === val));
  const hints = {
    um: "Com <b>um app só</b> não existe trilho: fica o menu clássico, igual ao de hoje. Troque para 3 apps e veja o trilho aparecer.",
    tres: "Cada preset é um <b>app no trilho</b>. Clique em Páginas, Tarefas e CRM: o menu do lado troca inteiro, nada se mistura. Aperte <kbd>[</kbd> para recolher.",
    fase1: "Com 6 apps o trilho ainda cabe. Experimente <b>Recolhido</b> e passe o mouse nos ícones: o menu do app flutua por cima.",
    todos: "Com <b>33 apps</b>, o trilho mostra só os <b>fixados</b> (⭐). O resto fica em <b>Todos os apps</b> (grade), na busca <kbd>Ctrl K</kbd> e em Configurações → Apps.",
  };
  $("simHint").innerHTML = hints[S.scenario] + (S.device === "phone" ? "<br><br>No <b>celular</b>: barra de apps embaixo (Início + 3 fixados + Apps) e o menu do app na gaveta ☰." : "");
}
const setMin = (m) => { $("sim").classList.toggle("min", m); $("simCaret").textContent = m ? "▴" : "▾"; store.set("simMin", m); };
setMin(store.get("simMin", false));
$("simToggle").onclick = () => setMin(!$("sim").classList.contains("min"));
$("scenario").onchange = (e) => { S.scenario = e.target.value; S.pins = null; S.disabled = []; store.set("scenario", S.scenario); store.set("pins", null); store.set("disabled", []); if (!installed().includes(route().app) && route().app !== "config") location.hash = "#/inicio/visao"; render(); };
$("device").onclick = (e) => { const v = e.target.closest("button")?.dataset.v; if (!v) return; S.device = v; if (v === "laptop") S.collapsed = true; if (v === "desktop") S.collapsed = false; store.set("device", v); store.set("collapsed", S.collapsed); S.overlay = null; S.flyout = null; render(); };
$("menuMode").onclick = (e) => { const v = e.target.closest("button")?.dataset.v; if (!v) return; S.collapsed = v === "collapsed"; S.flyout = null; store.set("collapsed", S.collapsed); render(); };
$("theme").onclick = (e) => { const v = e.target.closest("button")?.dataset.v; if (!v) return; S.theme = v; store.set("theme", v); render(); };
$("brand").onclick = (e) => { const v = e.target.closest("button")?.dataset.v; if (!v) return; S.brand = v; store.set("brand", v); render(); };
$("resetPins").onclick = () => { S.pins = null; store.set("pins", null); render(); };
$("resetAll").onclick = () => { try { Object.keys(localStorage).filter((k) => k.startsWith("rodsaas-sim:")).forEach((k) => localStorage.removeItem(k)); } catch {} location.hash = "#/inicio/visao"; location.reload(); };

if (!location.hash) location.hash = "#/inicio/visao";
render();
</script>
</body>
</html>
